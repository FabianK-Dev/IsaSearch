# Three roles, one image, one state volume.
#
#   docker compose run --rm tools python -m src.corpus --index-only     # 1a, with solr stopped
#   docker compose up -d solr
#   docker compose run --rm tools python -m src.corpus                  # 1b, with solr running
#   docker compose up -d                                                # serve the website
#   docker compose run --rm tools python -m src.duplicates --newest 10  # duplicate report
#
# The two build steps are separate because 'isabelle find_facts_index' writes the same Lucene index
# that the 'solr' service holds open, so the indexing has to happen with the service stopped, while
# everything after it needs the service up. The corpus has to be built before the website is started
# for the first time: the 'app' service runs in serve mode and reports a missing corpus instead of
# building one.
#
# ISASEARCH_API_KEY has to be set in the environment or in a .env file next to this file.

services:
  solr:
    # Match this tag to the Solr version bundled with the pinned Isabelle release; look for
    # Isabelle/contrib/solr-* on the state volume after the first build. A newer Solr can refuse to
    # open an index written by an older Lucene.
    image: solr:9.8.1
    # 'isabelle find_facts_index' writes a complete Solr home to ~/.isabelle/find_facts/solr, with
    # the index as a core named 'local' inside it. It is served directly from there - no core is
    # precreated and nothing is copied, so a rebuild is picked up by restarting this service.
    command: ["solr-foreground", "-s", "/data/home/.isabelle/find_facts/solr"]
    # The index is written by the build container, which runs as root, and Solr's own uid could not
    # read it. Both share one volume, so they have to agree on the user.
    user: "0:0"
    volumes:
      - state:/data
    ports:
      - "8983:8983"
    healthcheck:
      # wget, not curl: the official Solr image installs wget and does not install curl.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://localhost:8983/solr/local/admin/ping || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 30s
    restart: unless-stopped

  app:
    build: .
    image: isasearch
    command: ["python", "-m", "src.app"]
    depends_on:
      solr:
        condition: service_healthy
    environment:
      ISASEARCH_API_KEY: ${ISASEARCH_API_KEY:?ISASEARCH_API_KEY has to be set}
    volumes:
      - state:/data
      # The deployed configuration differs from the checked in one (solr_core_url has to name the
      # 'solr' service, isabelle_sessions is ["all"] in production), so the server's edited
      # config.json is mounted rather than a second configuration mechanism being introduced.
      - ./config.json:/app/config.json:ro
    ports:
      - "5001:5001"
    # boot_components probes the LLM and embedding servers before anything else and the application
    # boots at import time, so a server that is briefly unreachable kills the process. Restarting
    # covers that, and the Solr healthcheck covers the ordering on a cold start.
    restart: unless-stopped

  # Build and analysis runs. Started explicitly with 'docker compose run', never by 'up'.
  tools:
    build: .
    image: isasearch
    profiles: ["tools"]
    environment:
      ISASEARCH_API_KEY: ${ISASEARCH_API_KEY:?ISASEARCH_API_KEY has to be set}
    volumes:
      - state:/data
      - ./config.json:/app/config.json:ro

volumes:
  state:
