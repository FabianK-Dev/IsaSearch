<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Bootstrap demo</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
</head>

<body>
    <div class="container">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <img src="icon.png" alt="Logo" width="auto" height="30" class="d-inline-block align-text-top">
                    <b>AFP AI Search</b>
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">Search</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" target="_blank" rel="noopener">Paper</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="#" target="_blank" rel="noopener">Repository</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="/search/example search query?refine_query=true" target="_blank" rel="noopener">API Example</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="my-3"></div>

        <form>
            <div class="mb-3">
                <label for="searchInput" class="form-label"><b>Search:</b> Name, description or formula of a theorem to search for</label>
                <textarea class="form-control" id="searchInput" rows="4" placeholder="Examples:
- a^2 + b^2 = c^2
- bijections have inverses
- for any real number x and integer n (cos x + i sin x)^n = cos nx + i sin nx"></textarea>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="disableRefineCheck">
                <label class="form-check-label" for="disableRefineCheck"><a href="#" data-bs-toggle="tooltip" data-bs-title="By default a LLM will refine the search query to improve the search results. This can be disabled which increases search speed but also decreases search accuracy.">Disable query refinement</a></label>
            </div>
            <button class="btn btn-primary" onclick="search();">Search</button>
        </form>

        <div class="my-3"></div>

        <div class="mb-3" id="searchResults">
            <!-- Search results will be displayed here using JavaScript -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>

    <script>
        // Initialize tooltips
        const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]')
        const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl))

        // This is the recommended way of decoding a binary string, instead of only using atob()
        function decodeUnicode(str) {
            return decodeURIComponent(atob(str).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
        }

        function search() {
            const input = document.getElementById("searchInput").value;
            const refineQuery = !document.getElementById("disableRefineCheck").checked;
            const resultList = document.getElementById("searchResults");

            if (!input)
                return;

            console.log("Searching: input =", input, "disableRefine =", refineQuery, "resultList =", resultList);

            fetch("/search/" + input + "?refine_query=" + refineQuery)
            .then(response => {
                if (!response.ok) {
                    response.text().then(res => {
                        resultList.innerText = "An error occured:\n" + res;
                    });
                } else {
                    response.json().then(res => {
                        for (const el of res.results) {
                            let html = decodeUnicode(el.html);
                            console.log(html);
                            let div = document.createElement('div');
                            div.innerHTML = html.trim();

                            resultList.append(div);
                        }
                    });
                }
            });
        }
    </script>
</body>

</html>
