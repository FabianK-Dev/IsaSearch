<!doctype html>
<html lang="en">

<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>AFP AI Search</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-4Q6Gf2aSP4eDXB8Miphtr37CMZZQ5oXLH2yaXMJ2w8e2ZtHTl7GptT4jmndRuHDT" crossorigin="anonymous">
    <link href=" https://cdn.jsdelivr.net/npm/latex.js@0.12.6/dist/css/katex.min.css " rel="stylesheet">
</head>

<body>
    <div class="container">
        <nav class="navbar navbar-expand-lg bg-body-tertiary">
            <div class="container-fluid">
                <a class="navbar-brand" href="#">
                    <img src="icon.png" alt="Logo" width="auto" height="30" class="d-inline-block align-text-top">
                    <b>AFP AI Search</b>
                </a>

                <button class="navbar-toggler" type="button" data-bs-toggle="collapse"
                    data-bs-target="#navbarSupportedContent" aria-controls="navbarSupportedContent"
                    aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>

                <div class="collapse navbar-collapse" id="navbarSupportedContent">
                    <ul class="navbar-nav me-auto mb-2 mb-lg-0">
                        <li class="nav-item">
                            <a class="nav-link active" aria-current="page" href="#">Search</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="https://gitlab.lrz.de/Kadlez/afp-ai-search/-/blob/main/paper/latex/main.pdf" target="_blank" rel="noopener">Paper</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="https://gitlab.lrz.de/Kadlez/afp-ai-search/" target="_blank" rel="noopener">Repository</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="https://gitlab.lrz.de/Kadlez/afp-ai-search/-/blob/main/paper/latex/main.pdf#rest_api" target="_blank" rel="noopener">API</a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>

        <div class="my-3"></div>

        <form>
            <div class="mb-3">
                <label for="searchInput" class="form-label"><b>Search:</b> Name, description or formula of a theorem to search for</label>
                <textarea class="form-control" id="searchInput" rows="2" placeholder="Examples: a^2 + b^2 = c^2,
bijections have inverses, bubblesort, ..."></textarea>
            </div>
            <div class="mb-3 form-check">
                <input type="checkbox" class="form-check-input" id="disableRefineCheck">
                <label class="form-check-label" for="disableRefineCheck"><a href="#" data-bs-toggle="tooltip" data-bs-title="By default a LLM will refine the search query to improve the search results. This can be disabled which increases search speed but may decrease search accuracy.">Disable query refinement</a></label>
            </div>
            <button type="button" class="btn btn-primary" onclick="search();" id="searchButton">Search</button>
        </form>

        <div class="my-3"></div>

        <div class="alert alert-info" role="alert" id="LLMRefinedQueryParent" style="display: none;">
            <h6><span class="badge text-bg-primary" id="">LLM-refined query</span></h6>
            <div id="LLMRefinedQuery"></div>
        </div>

        <div class="alert alert-warning alert-dismissible fade show" role="alert" id="aiWarning" style="display: none;">
            <strong>⚠️ Warning:</strong> Refined queries and summaries are AI-generated and may be inaccurate. Please use as guidance only.
            <button type="button" class="btn-close" data-bs-dismiss="alert" aria-label="Close"></button>
        </div>

        <div class="card" style="display: none;" id="theoremTemplate">
            <div class="card-body">
                <h6 id="theoremTitle"></h6>
                <p style="font-size: 14px" id="theoremMetadata"></p>

                <div class="alert alert-light lh-1" role="alert" style="font-family: 'Courier New', Courier, monospace; font-size: 16px;" id="theoremCode"></div>

                <p>
                    <a href="javascript:void(0)" role="button" style="display: none; font-size: 14px;" id="theoremCodeExpand">+ Expand</a>
                </p>

                <h6><span class="badge text-bg-primary" id="">LLM Summary</span></h6>
                <p id="theoremLLMSummary" style="font-size: 16px;"></p>

                <div id="theoremSources"></div>
            </div>
        </div>

        <div class="mb-3" id="searchResults">
            <!-- Search results will be displayed here using JavaScript -->
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.6/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-j1CDi7MgGQ12Z7Qab0qlWQ/Qqz24Gc6BM0thvEMVjHnfYGF0rmFCozFSxQBxwHKO"
        crossorigin="anonymous"></script>

    <script src=" https://cdn.jsdelivr.net/npm/latex.js@0.12.6/dist/latex.min.js "></script>

    <script>
        // Initialize tooltips
        const tooltipTriggerList = document.querySelectorAll('[data-bs-toggle="tooltip"]')
        const tooltipList = [...tooltipTriggerList].map(tooltipTriggerEl => new bootstrap.Tooltip(tooltipTriggerEl))
        let firstSearch = true;

        function search() {
            const input = document.getElementById("searchInput").value;
            const refineQuery = !document.getElementById("disableRefineCheck").checked;
            const resultList = document.getElementById("searchResults");
            const template = document.getElementById("theoremTemplate");
            const llmRefinedQuery = document.getElementById("LLMRefinedQuery");
            const llmRefinedQueryParent = document.getElementById("LLMRefinedQueryParent");
            const aiWarning = document.getElementById("aiWarning");

            if (!input)
                return;

            const searchButton = document.getElementById("searchButton");
            searchButton.innerText = "Searching...";

            fetch("/search?query=" + encodeURIComponent(input) + "&refine_query=" + refineQuery)
            .then(response => {
                if (!response.ok) {
                    response.text().then(res => {
                        resultList.innerText = "An error occured:\n" + res;
                    });
                } else {
                    response.json().then(res => {
                        searchButton.innerText = "Search";
                        resultList.innerHTML = "";
                        llmRefinedQuery.innerHTML = "";

                        if (firstSearch) {
                            firstSearch = false;
                            aiWarning.style.display = "block";
                        }

                        if (res.refined_query) {
                            llmRefinedQueryParent.style.display = "block";

                            try {
                                let generator = new latexjs.HtmlGenerator({ hyphenate: true })
                                generator = latexjs.parse(res.refined_query.replace("):\n", "): ").trim(), { generator: generator })
                                llmRefinedQuery.appendChild(generator.domFragment());
                            } catch(err) {
                                console.log(err);
                                llmRefinedQuery.innerText = res.refined_query.replace("):\n", "): ").trim();
                            }
                        } else {
                            llmRefinedQueryParent.style.display = "none";
                        }

                        for (const el of res.results) {
                            let node = template.cloneNode(true);
                            node.src_code = el.src;

                            node.style.display = "block";
                            node.querySelector("#theoremTitle").innerText = el.theory;
                            node.querySelector("#theoremMetadata").innerText = "Distance: ~" + Math.round(el.distance * 10000) / 10000 + " | Start line: " + el.start_line

                            if (el.remote_url !== "#") {
                                node.querySelector("#theoremMetadata").innerHTML = '<a href="' + el.remote_url + '" target="_blank" rel="noopener">Open file</a> | ' + node.querySelector("#theoremMetadata").innerHTML;
                            }

                            if (el.entry_url !== "#") {
                                node.querySelector("#theoremMetadata").innerHTML = '<a href="' + el.entry_url + '" target="_blank" rel="noopener">Show entry</a> | ' + node.querySelector("#theoremMetadata").innerHTML;
                            }

                            if (el.theory_url !== "#") {
                                node.querySelector("#theoremMetadata").innerHTML = '<a href="' + el.theory_url + '" target="_blank" rel="noopener">Open theory</a> | ' + node.querySelector("#theoremMetadata").innerHTML;
                            }

                            if (node.src_code.split("\n").length > 5) {
                                node.querySelector("#theoremCode").innerText = node.src_code.split("\n").slice(0, 5).join("\n")
                                node.querySelector("#theoremCode").innerHTML = node.querySelector("#theoremCode").innerHTML + "<br><b>... (collapsed)</b>";
                                node.querySelector("#theoremCodeExpand").style.display = "block";

                                node.querySelector("#theoremCodeExpand").addEventListener("click", () => {
                                    node.querySelector("#theoremCode").innerText = node.src_code;
                                    node.querySelector("#theoremCodeExpand").style.display = "none";
                                });
                            } else {
                                node.querySelector("#theoremCode").innerText = node.src_code
                            }

                            let llm_description = el.llm_description.replace("):\n", "): ").trim();

                            try {
                                let generator = new latexjs.HtmlGenerator({ hyphenate: true })
                                generator = latexjs.parse(llm_description, { generator: generator })
                                node.querySelector("#theoremLLMSummary").appendChild(generator.domFragment());
                            } catch(err) {
                                node.querySelector("#theoremLLMSummary").innerText = llm_description;
                            }

                            resultList.append(node);
                        }
                    });
                }
            });
        }
    </script>
</body>

</html>
